<!DOCTYPE html><html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schul-App</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1f2937;
        color: white;
        padding: 50px 20px;
        text-align: center;
    }

    header h1 {
        margin: 0 0 10px;
        font-size: 42px;
    }

    header p {
        margin: 0;
        font-size: 18px;
    }

    main {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .card h2 {
        margin-top: 0;
        font-size: 28px;
    }

    .card p {
        color: #555;
        line-height: 1.6;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 30px;
    }

    .button {
        display: inline-block;
        padding: 15px 25px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        color: white;
        background: #2563eb;
    }

    .button:hover {
        opacity: 0.85;
    }

    footer {
        text-align: center;
        padding: 30px 20px;
        color: #777;
    }

    @media (max-width: 600px) {
        header h1 {
            font-size: 32px;
        }

        .card {
            padding: 25px 18px;
        }
    }
</style>

</head><body><header>
    <h1>🏫 Schul-App</h1>
    <p>Alles Wichtige deiner Schule an einem Ort.</p>
</header><main>
    <div class="card">
        <h2>Unsere Schul-App</h2>    <p>
        Hier kannst du später die App für dein Gerät installieren
        und wichtige Informationen deiner Schule abrufen.
    </p>

    <div class="buttons">
        <a class="button" href="#">
            📱 App installieren
        </a>
    </div>
</div>

</main><footer>
    © 2026 Schul-App
</footer></body>
</html>
